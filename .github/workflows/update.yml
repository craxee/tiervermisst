name: Fundtiere aktualisieren

on:
  schedule:
    - cron: "17 * * * *"   # jede Stunde
  workflow_dispatch:          # Knopf "Run workflow" zum manuellen Starten
  push:
    branches: [main]          # nach eigenen Änderungen sofort neu veröffentlichen

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fundtiere und Fotos von der Stadt Wien holen
        id: update
        run: python scripts/update.py
        timeout-minutes: 8
        continue-on-error: true   # Seite wird trotzdem mit den letzten Daten veröffentlicht

      - name: Neue Daten speichern
        run: |
          git config user.name "fundtiere-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p photos
          git add data.json photos
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Fundtiere aktualisiert"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Fehler beim Abholen melden
        if: steps.update.outcome == 'failure' && github.event_name != 'push'
        run: |
          echo "::error::Die Daten der Stadt Wien konnten nicht abgeholt werden. Die Seite zeigt weiter die letzten Daten."
          exit 1

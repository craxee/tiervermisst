name: Fundtiere aktualisieren

on:
  schedule:
    - cron: "7,22,37,52 7-19 * * *"   # alle 15 Min. nachsehen, ca. 9–21 Uhr Wiener Zeit
  workflow_dispatch:          # Knopf "Run workflow" zum manuellen Starten
  push:
    branches: [main]          # nach eigenen Änderungen sofort neu veröffentlichen

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Abruf nur, wenn der letzte länger als 50 Minuten her ist.
      # Fällt ein Termin aus, holt der nächste (15 Min. später) ihn nach.
      - name: Prüfen, ob ein Abruf fällig ist
        id: due
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, datetime
          try:
              u = datetime.datetime.fromisoformat(json.load(open("data.json"))["updated"])
              age = (datetime.datetime.now(datetime.timezone.utc) - u).total_seconds() / 60
          except Exception:
              age = 9999
          print("run=true" if age >= 50 else "run=false")
          PY
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fundtiere und Fotos von der Stadt Wien holen
        if: steps.due.outputs.run == 'true'
        id: update
        run: python scripts/update.py
        timeout-minutes: 8
        continue-on-error: true   # Seite wird trotzdem mit den letzten Daten veröffentlicht

      - name: Neue Daten speichern
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name "fundtiere-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p photos
          git add data.json photos
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Fundtiere aktualisiert"
            git pull --rebase -X theirs origin main
            git push
          fi

      - uses: actions/configure-pages@v5
        if: steps.due.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.due.outputs.run == 'true'
        with:
          path: .

      - id: deploy
        if: steps.due.outputs.run == 'true'
        uses: actions/deploy-pages@v4

      - name: Fehler beim Abholen melden
        if: steps.due.outputs.run == 'true' && steps.update.outcome == 'failure' && github.event_name != 'push'
        run: |
          echo "::error::Die Daten der Stadt Wien konnten nicht abgeholt werden. Die Seite zeigt weiter die letzten Daten."
          exit 1
